<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seoul Solo Trip Kit</title>
<style>
  body {
    background: #F5EDDA;
    color: #3B2E1F;
    padding: 28px 14px 60px;
  }
  #tg-app {
    --paper: #FBF6EC; --paper2: #F5EDDA; --card: #FFFFFF;
    --ink: #3B2E1F; --muted: #8A7A63; --line: #EEE3CC;
    --accent: #F2A65A; --accent2: #E8895C;
    --ok: #5B8A3A; --ng: #C4432B; --unsure: #B8923A;
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Segoe UI', sans-serif;
    background: var(--paper); color: var(--ink);
    max-width: 480px; margin: 0 auto; border-radius: 20px; overflow: hidden;
    position: relative; min-height: 640px;
  }
  #tg-app * { box-sizing: border-box; }
  .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif; }

  #tg-main { padding: 14px 18px 30px; min-height: 560px; }

  .top-bar { display:flex; align-items:center; gap:10px; margin-bottom: 6px; }
  .back-btn {
    width:34px; height:34px; border-radius:50%; border:none; background:var(--card);
    box-shadow:0 2px 6px rgba(59,46,31,0.08); display:flex; align-items:center; justify-content:center;
    font-size:16px; cursor:pointer; color:var(--ink); flex-shrink:0;
  }
  .top-title { font-size:13px; color:var(--muted); }

  /* ---------- top tab nav ---------- */
  .tab-nav {
    display:flex; gap:6px; overflow-x:auto; padding: 12px 0 10px;
    position: sticky; top:0; background: var(--paper); z-index: 10;
  }
  .tab-btn {
    flex-shrink:0; font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:999px;
    border:1px solid var(--line); background:var(--card); color:var(--muted); cursor:pointer;
  }
  .tab-btn.active { background: var(--accent2); border-color: var(--accent2); color:#fff; }

  .hero { padding: 6px 2px 14px; }
  .hero .eyebrow { font-size:11px; letter-spacing:1.5px; color:var(--accent2); font-weight:700; }
  .hero h1 { font-size:28px; margin:4px 0 2px; font-weight:600; }
  .hero .sub { font-size:12.5px; color:var(--muted); }

  /* ---------- day cards / stop cards ---------- */
  .day-header h2 { font-size:24px; margin:2px 0 4px; }
  .day-header .d-desc { font-size:12.5px; color:var(--muted); margin-bottom: 16px; }
  .stop-card { background: var(--card); border-radius: 18px; padding: 14px 16px; margin-bottom: 12px;
    box-shadow: 0 4px 12px rgba(59,46,31,0.06); display: flex; gap: 12px; align-items: center; }
  .stop-icon { width: 44px; height:44px; border-radius:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:20px; background: var(--paper2); }
  .stop-body { flex:1; min-width:0; }
  .stop-time { font-size:10.5px; color:var(--accent2); font-weight:700; }
  .stop-name { font-size:15px; font-weight:600; margin-top:1px; }
  .stop-kr { font-size:11px; color:var(--muted); }
  .stop-highlight { font-size:11.5px; color:var(--ink); opacity:0.75; margin-top:3px; line-height:1.4; }
  .stop-cuisine { font-size:11px; color:var(--accent2); font-weight:700; margin-top:2px; }
  .stop-alt { font-size:10px; color:var(--unsure); margin-top:4px; }
  .detail-btn { font-size:11.5px; font-weight:600; color: var(--accent2); background: var(--paper2);
    border:none; border-radius:999px; padding:6px 12px; margin-top:8px; cursor:pointer; }
  .note-card { padding: 6px 16px 6px 60px; font-size:12px; color: var(--muted); margin-bottom: 10px; }

  /* ---------- places page ---------- */
  .filter-strip { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; }
  .filter-pill { flex-shrink:0; font-size:12px; padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--muted); cursor:pointer; font-weight:600; }
  .filter-pill.active { background: var(--accent2); border-color: var(--accent2); color:#fff; }
  .place-row { background: var(--card); border-radius:16px; padding:12px 14px; margin-bottom:10px;
    display:flex; gap:12px; align-items:center; cursor:pointer; box-shadow: 0 3px 10px rgba(59,46,31,0.05); }
  .place-row .stop-icon { width:38px; height:38px; font-size:17px; }
  .footer-link { text-align:center; margin-top:10px; }
  .footer-link a { font-size:12px; color:var(--muted); text-decoration:underline; }

  /* ---------- sources page ---------- */
  .source-group { margin-bottom: 20px; }
  .source-group h3 { font-size:13px; color:var(--accent2); margin-bottom:8px; }
  .source-item { background: var(--card); border-radius:14px; padding:10px 14px; margin-bottom:8px; font-size:12px; }
  .source-item .s-name { font-weight:600; color:var(--ink); }
  .source-item a { color: var(--accent2); word-break: break-all; font-size:11px; text-decoration:none; }
  .source-item .s-missing { color: var(--unsure); font-size:11px; font-style: italic; }

  /* ---------- detail modal (place) ---------- */
  .modal-overlay { position:absolute; inset:0; background: var(--paper); z-index:30; overflow-y:auto; padding-bottom: 30px; }
  .modal-close { position: sticky; top:12px; left:12px; width:34px; height:34px; border-radius:50%;
    border:none; background:rgba(255,255,255,0.9); box-shadow:0 2px 8px rgba(0,0,0,0.12);
    font-size:16px; cursor:pointer; margin: 12px 0 0 12px; z-index: 5; }
  .carousel { height: 190px; margin: -34px 0 0; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  .carousel-slide { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:60px; }
  .carousel-dots { position:absolute; bottom:10px; display:flex; gap:5px; left:50%; transform:translateX(-50%); }
  .c-dot { width:6px; height:6px; border-radius:50%; background:rgba(59,46,31,0.25); }
  .c-dot.active { background: var(--accent2); }
  .carousel-note { text-align:center; font-size:10.5px; color:var(--muted); margin-top:6px; }
  .gmaps-photo-link { display:block; text-align:center; font-size:11.5px; color:var(--accent2); margin: 4px 0 10px; text-decoration:underline; }
  .detail-body { padding: 0 20px; }
  .detail-title { font-size:24px; font-weight:600; margin: 4px 0 2px; }
  .detail-kr { font-size:13px; color: var(--muted); }
  .detail-roman { font-size:12px; color: var(--muted); }
  .info-grid { margin: 16px 0; display:flex; flex-direction:column; gap:10px; }
  .info-row { display:flex; gap:10px; font-size:12.5px; }
  .info-row .i-label { width: 78px; flex-shrink:0; color: var(--accent2); font-weight:700; }
  .info-row .i-val { flex:1; color: var(--ink); line-height:1.5; }
  .section-block { margin: 18px 0; padding: 16px; background: var(--card); border-radius:16px; }
  .section-block h4 { font-size:12.5px; color: var(--accent2); margin:0 0 10px; }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; color:#fff; }
  .badge.ok { background: var(--ok); } .badge.ng { background: var(--ng); } .badge.unsure { background: var(--unsure); }
  .jp-source { font-size:11px; color: var(--muted); line-height:1.6; }
  .jp-source a { color: var(--accent2); }
  .link-grid { display:flex; flex-wrap:wrap; gap:8px; margin-top: 6px; }
  .ext-link { font-size:12px; text-decoration:none; padding:8px 13px; border-radius:12px; background: var(--paper2);
    color: var(--ink); font-weight:600; display:flex; align-items:center; gap:5px; }
  .ext-link.primary { background: var(--accent2); color:#fff; }
  .alt-row { display:flex; gap:8px; overflow-x:auto; margin-top:8px; }
  .alt-card { flex-shrink:0; width: 140px; background: var(--paper2); border-radius:14px; padding:10px; cursor:pointer; }
  .alt-card .a-name { font-size:12px; font-weight:700; }
  .alt-card .a-note { font-size:10.5px; color:var(--muted); margin-top:2px; }

  /* ================= PREP DASHBOARD ================= */
  .prep-progress { background: var(--card); border-radius:18px; padding:16px; margin-bottom:16px; }
  .prep-progress .pp-num { font-size:20px; font-weight:700; }
  .prep-track { height:8px; background:var(--paper2); border-radius:4px; overflow:hidden; margin-top:8px; }
  .prep-fill { height:100%; background: var(--accent2); border-radius:4px; transition: width 0.25s; }

  .due-soon { background: #FFF1E0; border: 1px dashed var(--accent2); border-radius:16px; padding:14px 16px; margin-bottom:16px; }
  .due-soon h4 { font-size:12px; color:var(--accent2); margin:0 0 8px; }
  .due-item { font-size:12.5px; margin-bottom:4px; }
  .due-item .due-date { font-weight:700; color:var(--accent2); margin-right:6px; }
  .due-ok { font-size:13px; color: var(--ok); font-weight:600; }

  .prep-filter-strip { display:flex; gap:8px; overflow-x:auto; margin-bottom: 14px; }

  .prep-section { background: var(--card); border-radius:18px; margin-bottom:14px; overflow:hidden; }
  .prep-section-head { padding:14px 16px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .prep-section-head h3 { font-size:14.5px; margin:0; }
  .prep-section-head .ps-en { font-size:10.5px; color:var(--muted); display:block; }
  .prep-section-head .ps-caret { font-size:14px; color:var(--muted); transition: transform 0.2s; }
  .prep-section-body { padding: 0 16px 14px; }
  .prep-group-label { font-size:11.5px; font-weight:700; color:var(--accent2); margin:10px 0 6px; }

  .task-row { display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-top:1px solid var(--paper2); }
  .task-row:first-child { border-top:none; }
  .task-check {
    width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex-shrink:0; margin-top:1px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; font-weight:700;
  }
  .task-check.doing { border-color: var(--unsure); background: repeating-linear-gradient(45deg, var(--unsure), var(--unsure) 3px, transparent 3px, transparent 6px); opacity:0.55; }
  .task-check.done { border-color: var(--ok); background: var(--ok); }
  .task-label { font-size:13px; line-height:1.5; flex:1; }
  .task-label.done-text { text-decoration: line-through; color: var(--muted); }
  .task-badge { display:inline-block; font-size:10px; background: var(--paper2); color:var(--accent2); font-weight:700;
    border-radius:999px; padding:2px 8px; margin-left:6px; }
  .task-recheck { font-size:10px; color: var(--unsure); margin-left:6px; }

  .info-card { background: var(--paper2); border-radius:14px; padding:12px 14px; margin: 8px 0; font-size:12.5px; line-height:1.7; }
  .info-card .ic-title { font-weight:700; color: var(--accent2); margin-bottom:4px; }

  .flight-card, .hotel-card { background: var(--paper2); border-radius:14px; padding:14px; margin-bottom:10px; }
  .flight-card .fc-route { font-size:15px; font-weight:700; }
  .flight-card .fc-time { font-size:12.5px; color:var(--muted); margin-top:2px; }

  .form-field { margin-bottom:10px; }
  .form-field label { font-size:11.5px; color:var(--muted); display:block; margin-bottom:4px; }
  .form-field input, .form-field select {
    width:100%; padding:9px 11px; border-radius:10px; border:1px solid var(--line); font-size:13px; background:#fff;
    font-family: inherit; color: var(--ink);
  }
  .coverage-list { font-size:12.5px; line-height:2; }

  .accordion-item { border-top:1px solid var(--paper2); }
  .accordion-item:first-child { border-top:none; }
  .accordion-head { display:flex; justify-content:space-between; padding:10px 0; cursor:pointer; font-size:13px; font-weight:600; }

  .tip-card { background: var(--paper2); border-radius:14px; padding:14px; margin-bottom:10px; }
  .tip-card .tip-point { font-size:13.5px; font-weight:700; margin-bottom:6px; }
  .tip-card .tip-conclusion { font-size:12.5px; margin-bottom:8px; }
  .tip-card .tip-quote { font-style:italic; font-size:12.5px; border-left:3px solid var(--accent); padding-left:8px; margin-bottom:6px; }
  .tip-card .tip-source { font-size:10.5px; color: var(--muted); }

  .trouble-card { background: var(--paper2); border-radius:14px; padding:14px; margin-bottom:10px; }
  .trouble-card .tr-title { font-size:14px; font-weight:700; margin-bottom:8px; }
  .trouble-card .tr-step { font-size:12px; line-height:1.6; margin-bottom:4px; padding-left:14px; position:relative; }
  .trouble-card .tr-step::before { content:'・'; position:absolute; left:0; color: var(--accent2); }

  .backup-item { background: var(--paper2); border-radius:14px; padding:12px 14px; margin-bottom:8px; }
  .backup-item .bi-name { font-size:13.5px; font-weight:700; }
  .backup-item .bi-kr { font-size:11px; color: var(--muted); }
  .backup-item .bi-hours { font-size:11px; color: var(--ok); font-weight:600; margin-top:3px; }
  .backup-item .bi-note { font-size:11.5px; margin-top:3px; }

  .toilet-badge { font-size:26px; text-align:center; margin: 6px 0; }
  .toilet-word { text-align:center; font-size:20px; font-weight:700; margin-bottom:10px; }
  .toilet-chip-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .toilet-chip { font-size:11.5px; background: var(--paper2); padding:6px 12px; border-radius:999px; }

  .contact-btn {
    width:100%; display:flex; justify-content:space-between; align-items:center;
    background: var(--paper2); border:none; border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer;
  }
  .contact-btn .cb-name { font-size:13.5px; font-weight:700; }
  .contact-btn .cb-num { font-size:12px; color:var(--accent2); }
  .contact-btn.big { background: var(--ng); }
  .contact-btn.big .cb-name, .contact-btn.big .cb-num { color:#fff; }

  .final-check-list .task-row { padding: 11px 0; }
  .tomorrow-card { background: var(--ink); color: #fff; border-radius:16px; padding:16px; margin-top:16px; }
  .tomorrow-card .tc-label { font-size:11px; opacity:0.7; letter-spacing:1px; }
  .tomorrow-card .tc-flight { font-size:18px; font-weight:700; margin:4px 0; }

  /* emergency floating button + modal */
  .emergency-fab {
    position:absolute; right:14px; top:14px; z-index:15; width:42px; height:42px; border-radius:50%;
    background: var(--ng); color:#fff; border:none; font-size:18px; box-shadow:0 4px 10px rgba(196,67,43,0.4); cursor:pointer;
  }
  .emergency-overlay { position:absolute; inset:0; background: rgba(0,0,0,0.4); z-index:40; display:flex; align-items:flex-end; }
  .emergency-card { background:#fff; width:100%; max-height:88%; overflow-y:auto; border-radius:24px 24px 0 0; padding:20px; }
  .emergency-card h2 { color: var(--ng); font-size:20px; margin:0 0 4px; }
  .em-step { background: #FDEDEA; border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .em-step .es-num { font-size:10.5px; color: var(--ng); font-weight:700; }
  .em-step .es-text { font-size:13px; margin-top:2px; line-height:1.6; }
  .em-close { display:block; margin: 14px auto 0; background:none; border:none; color:var(--muted); font-size:13px; }
</style>
</head>

  function renderDetail(){
    const p = PLACES[state.detailId];
    const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
    const closeBtn = document.createElement('button'); closeBtn.className='modal-close'; closeBtn.textContent='✕';
    closeBtn.onclick = closeDetail; overlay.appendChild(closeBtn);

    // swipe left or right to go back, like a native back gesture
    let touchStartX = null, touchStartY = null;
    overlay.addEventListener && overlay.addEventListener('touchstart', (e)=>{
      touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
    }, {passive:true});
    overlay.addEventListener && overlay.addEventListener('touchend', (e)=>{
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        closeDetail();
      }
      touchStartX = null; touchStartY = null;
    }, {passive:true});

    const carousel = document.createElement('div'); carousel.className='carousel';
    carousel.innerHTML = '<div class="carousel-slide">'+((p.cuisine||p.activity||'').split(' ')[0] || ICONS[p.kind] || '📍')+'</div>' +
      '<div class="carousel-dots"><span class="c-dot active"></span><span class="c-dot"></span><span class="c-dot"></span></div>';
    overlay.appendChild(carousel);
    const carouselNote = document.createElement('div'); carouselNote.className='carousel-note';
    carouselNote.textContent = '目前沒有內建實際照片（避免未經授權重製圖片）';
    overlay.appendChild(carouselNote);
    if (p.placeId){
      const gLink = document.createElement('a'); gLink.className='gmaps-photo-link'; gLink.href=gmapsPlaceUrl(p.placeId);
      gLink.target='_blank'; gLink.rel='noopener noreferrer'; gLink.textContent='📷 到 Google Maps 看真實照片與評論';
      overlay.appendChild(gLink);
    }

    const body = document.createElement('div'); body.className='detail-body';
    body.innerHTML = '<div class="detail-title serif">'+p.nameZh+'</div><div class="detail-kr">'+(p.nameKr||'')+'</div>' +
      (p.cuisine || p.activity ? '<div class="stop-cuisine" style="font-size:13px;margin-top:4px;">'+(p.cuisine||p.activity)+'</div>' : '') +
      '<div class="detail-roman">'+(p.nameRoman||'')+'</div>';

  /* ================= PREP RENDER ================= */
  function taskStatus(id){ return prepStatus[id] || 'todo'; }
  function cycleTask(id){
    const cur = taskStatus(id);
    const next = cur==='todo' ? 'doing' : (cur==='doing' ? 'done' : 'todo');
    prepStatus[id] = next; saveLS('seoul-prep-status-v1', prepStatus); render();
  }
  function allTaskIds(){
    let ids = [];
    PREP_SECTIONS.forEach(sec=>{
      if (sec.type==='tasks' && sec.groups) sec.groups.forEach(g=> g.tasks.forEach(t=> ids.push(t.id)));
      if (sec.type==='flighthotel'){ sec.flightTasks.forEach(t=>ids.push(t.id)); sec.hotelTasks.forEach(t=>ids.push(t.id)); }
      if (sec.type==='insurance') sec.tasks.forEach(t=>ids.push(t.id));
      if (sec.type==='finalnight') sec.tasks.forEach(t=>ids.push(t.id));
    });
    return ids;
  }
  function renderTaskRow(t){
    const st = taskStatus(t.id);
    if (state.prepFilter !== '全部'){
      const map = {'未開始':'todo','進行中':'doing','已完成':'done'};
      if (st !== map[state.prepFilter]) return null;
    }
    const row = document.createElement('div'); row.className='task-row';
    const chk = document.createElement('div'); chk.className='task-check'+(st==='doing'?' doing':(st==='done'?' done':''));
    chk.textContent = st==='done' ? '✓' : '';
    chk.onclick = ()=> cycleTask(t.id);
    row.appendChild(chk);
    const label = document.createElement('div'); label.className='task-label'+(st==='done'?' done-text':'');
    label.innerHTML = t.label + (t.dateBadge ? ' <span class="task-badge">'+t.dateBadge+'</span>' : '');
    row.appendChild(label);
    return row;
  }
  function toggleSection(id){ state.prepOpen[id] = !state.prepOpen[id]; render(); }

  function renderPrepSectionShell(sec, bodyBuilder){
    const box = document.createElement('div'); box.className='prep-section';
    const head = document.createElement('div'); head.className='prep-section-head';
    head.onclick = ()=> toggleSection(sec.id);
    head.innerHTML = '<div><h3 class="serif">'+sec.title+'</h3><span class="ps-en">'+sec.en+'</span></div>' +
      '<span class="ps-caret">'+(state.prepOpen[sec.id] ? '▲' : '▼')+'</span>';
    box.appendChild(head);
    if (state.prepOpen[sec.id]){
      const bodyEl = document.createElement('div'); bodyEl.className='prep-section-body';
      bodyBuilder(bodyEl);
      box.appendChild(bodyEl);
    }
    return box;
  }

    // progress
    const ids = allTaskIds();
    const done = ids.filter(id=>taskStatus(id)==='done').length;
    const prog = document.createElement('div'); prog.className='prep-progress';
    prog.innerHTML = '<span class="pp-num">'+done+' / '+ids.length+'</span> 已完成' +
      '<div class="prep-track"><div class="prep-fill" style="width:'+(ids.length?Math.round(done/ids.length*100):0)+'%"></div></div>';
    wrap.appendChild(prog);

    // due soon
    const now = new Date();
    const soon = DUE_SOON_ITEMS.filter(it=>{
      const d = new Date(it.date+'T00:00:00');
      const diffDays = (d - now) / 86400000;
      return diffDays <= 3; // overdue or within 3 days

    const dueBox = document.createElement('div'); dueBox.className='due-soon';

            const btn = document.createElement('button'); btn.className='contact-btn'+(c.big?' big':'');
            btn.innerHTML = '<span class="cb-name">'+c.name+'</span><span class="cb-num">'+c.num+'</span>';
            if (c.tel) btn.onclick = ()=>{ window.location.href = 'tel:'+c.tel; };
            bodyEl.appendChild(btn);
          });
        });
      } else if (sec.type === 'finalnight'){
        sectionEl = renderPrepSectionShell(sec, (bodyEl)=>{
          const list = document.createElement('div'); list.className='final-check-list';
          sec.tasks.forEach(t=>{ const row = renderTaskRow(t); if (row) list.appendChild(row); });
          bodyEl.appendChild(list);
          const tc = document.createElement('div'); tc.className='tomorrow-card';
          tc.innerHTML = '<div class="tc-label">明天 TOMORROW</div><div class="tc-flight">'+sec.tomorrow.code+'</div><div>'+sec.tomorrow.route+'</div>';
          bodyEl.appendChild(tc);
        });
      }
      if (sectionEl) wrap.appendChild(sectionEl);
    });

    mainEl.appendChild(wrap);
  }

  /* ---------- EMERGENCY MODAL ---------- */
  function renderEmergency(){
    const overlay = document.createElement('div'); overlay.className='emergency-overlay';
    const card = document.createElement('div'); card.className='emergency-card';
    card.innerHTML = '<h2>🚨 護照遺失怎麼辦</h2>' +
      '<div class="em-step"><div class="es-num">STEP 1</div><div class="es-text">到韓國警察局申報護照遺失。</div></div>' +
      '<div class="em-step"><div class="es-num">STEP 2</div><div class="es-text">聯絡駐韓國台北代表部。<br><b>Taipei Mission in Korea</b><br>서울특별시 종로구 세종대로 149 광화문빌딩 6층<br>一般電話：+82-2-6329-6000<br>急難救助：+82-10-9080-2761</div></div>' +
      '<div class="link-grid" style="margin-bottom:12px;">' +
        '<a class="ext-link primary" href="tel:+82226329600">📞 打一般電話</a>' +
        '<a class="ext-link" href="tel:+821090802761">📞 急難救助</a>' +
        '<a class="ext-link" href="'+naverUrl('광화문빌딩 세종대로149')+'" target="_blank" rel="noopener noreferrer">📍 NAVER Map</a>' +
      '</div>' +
      '<div class="em-step"><div class="es-num">STEP 3</div><div class="es-text">依代表部指示辦理護照／緊急旅行文件，以及韓國出入境相關手續。</div></div>' +
      '<div class="em-step"><div class="es-num">補充</div><div class="es-text">台灣境內「旅外國人急難救助服務專線」：0800-085-095（供國內親友聯繫使用）</div></div>';
    const closeBtn = document.createElement('button'); closeBtn.className='em-close'; closeBtn.textContent='關閉';
    closeBtn.onclick = ()=>{ state.emergencyOpen = false; render(); };
    card.appendChild(closeBtn);
    overlay.appendChild(card);
    overlay.onclick = (e)=>{ if (e.target === overlay){ state.emergencyOpen = false; render(); } };
    document.getElementById('tg-app').appendChild(overlay);
  }

  /* ---------- MAIN RENDER ---------- */
  function render(){
    const savedScrollY = window.scrollY;
    mainEl.innerHTML = '';
    document.querySelectorAll('#tg-app .modal-overlay, #tg-app .emergency-overlay, #tg-app .emergency-fab').forEach(el=>el.remove());

    renderTabNav();

    if (state.view === 'prep') renderPrep();
    else if (state.view === 'day') renderDay();
    else if (state.view === 'places') renderPlaces();
    else if (state.view === 'sources') renderSources();

    document.getElementById('tg-app').appendChild(emergencyBtn);
    if (state.detailId) renderDetail();
    if (state.emergencyOpen) renderEmergency();

    requestAnimationFrame(()=>{ window.scrollTo(0, state.resetScroll ? 0 : savedScrollY); });
    state.resetScroll = false;
  }

  render();
})();
</script>
</body>
</html>
